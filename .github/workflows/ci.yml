name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # MegaBotTron1999, the shell the modules are developed against, is a submodule.
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The checks of `npm run validate`, without fixing anything (`npm run ci`, step by step).
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check game content
        run: npm run check:universe

      - name: Check the modules' version locks
        run: npm run check:locks

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage
